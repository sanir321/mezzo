<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <title>Mezzo — Free Spotify Alternative | Lossless Music, Zero Ads &amp; Offline Player</title>
    <meta name="description" content="Mezzo is a 100% free, ad-free Spotify alternative. Stream millions of tracks in Lossless Hi-Res FLAC quality with synchronized lyrics, 10-band studio EQ, and offline downloads for Android and Web." />
    <meta name="keywords" content="free spotify alternative, spotify alternative without ads, lossless music streaming, free music downloader, offline music player, synced lyrics player, flac music player, ad-free music, mezzo music, android music apk" />
    <meta name="author" content="Mezzo Music" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://mezzo-music.pages.dev" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mezzo-music.pages.dev" />
    <meta property="og:site_name" content="Mezzo Music" />
    <meta property="og:title" content="Mezzo — Free Spotify Alternative | Lossless Music &amp; Offline Player" />
    <meta property="og:description" content="100% Free, Ad-Free Music Streaming with Lossless FLAC audio, synced real-time lyrics, 10-band equalizer, and offline downloads." />
    <meta property="og:image" content="https://mezzo-music.pages.dev/android/android-launchericon-512-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Mezzo Music Logo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mezzo-music.pages.dev" />
    <meta name="twitter:title" content="Mezzo — Free Spotify Alternative | Lossless Audio &amp; Offline Mode" />
    <meta name="twitter:description" content="Stream lossless FLAC music with zero ads, synchronized karaoke lyrics, and smart offline downloads on Web &amp; Android." />
    <meta name="twitter:image" content="https://mezzo-music.pages.dev/android/android-launchericon-512-512.png" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Mezzo",
        "url": "https://mezzo-music.pages.dev",
        "description": "Free, ad-free music streaming platform and Android application with lossless audio, real-time synchronized lyrics, and offline downloads.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Android, Web, Windows, macOS, iOS, Linux",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "ratingCount": "1250"
        }
      }
    </script>

    <!-- Mobile PWA & iOS Metatags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mezzo" />
    <meta name="apple-mobile-web-app-orientations" content="portrait" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/assets/safari-pinned-tab.svg" color="#1ed760" />
    <link rel="preload" as="image" type="image/svg+xml" href="/logo.svg" />

    <!-- SvelteKit tags -->
    <link rel="manifest" href="/manifest.json" />

    <script>
      var parcelRequire;

      // if (!("appearance" in localStorage)) {
      // 	localStorage.theme = "Dark";
      // }
      const hasSettings = localStorage.settings;
      if (!hasSettings) document.documentElement.classList.add("Dark");
      else
        document.documentElement.classList.add(
          JSON.parse(hasSettings)?.appearance?.Theme ?? "Dark",
        );
    </script>
    %sveltekit.head%
  </head>
  <div id="app">%sveltekit.body%</div>
</html>
