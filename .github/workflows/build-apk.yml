name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bust stale Vite/SvelteKit cache
        run: rm -rf node_modules/.vite .svelte-kit

      - name: Build static SPA bundle
        env:
          STATIC_BUILD: "1"
          VITE_PUBLIC_API_BASE: ${{ vars.VITE_PUBLIC_API_BASE || vars.PUBLIC_API_BASE || 'https://mezzo-music.pages.dev' }}
        run: npm run build

      - name: Sync web assets into Android project
        run: rm -rf android/app/src/main/assets && npx cap sync android

      - name: Provision release signing keystore
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/mezzo-release.p12
          cat > keystore.properties <<EOF
          storeFile=keystore/mezzo-release.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK for release
        run: |
          mkdir -p ../dist-apk
          cp android/app/build/outputs/apk/release/*.apk ../dist-apk/Mezzo-1.0.apk || cp android/app/build/outputs/apk/release/*-release.apk ../dist-apk/Mezzo-1.0.apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mezzo-apk
          path: dist-apk/Mezzo-1.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "Mezzo Android Release v1.0.3"
          body: "Official Mezzo Lossless Audio Streaming App for Android (.apk) - Full Artist Discography, Direct Profile Navigation & Enhanced Search"
          draft: false
          prerelease: false
          files: dist-apk/Mezzo-1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}